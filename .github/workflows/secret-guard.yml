name: Secret Guard

# 本地 pre-commit 钩子可用 `git commit --no-verify` 绕过，
# 所以这里在服务端再兜一层：任何 push / PR 都会强制跑一遍扫描，
# 命中即让该次 CI 失败。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: 密钥与隐私扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 扫描全部历史分支，而不是只扫浅克隆
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 必须早于死代码检查：find-dead-code.mjs 用
      # createRequire(app/package.json) 解析 app/node_modules 里的包，
      # 依赖没装时它会直接崩，而不是给出"检查通过"的结论。
      - name: 安装依赖
        working-directory: app
        run: npm install

      - name: 守卫自测（确认检查器本身没坏）
        run: node tools/guard-secrets.mjs --self-test

      - name: 死代码检查（不可达文件 / 无引用依赖）
        run: node tools/find-dead-code.mjs --check

      - name: 全历史敏感路径扫描
        run: node tools/guard-secrets.mjs --history

      - name: 工作区内容特征扫描
        run: node tools/guard-secrets.mjs --all

      - name: gitleaks 深度扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 私人仓库可放开；公开仓库发现泄漏时不要让 PR 补丁把密钥再带回来
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: 构建校验（防止守卫上线后把构建搞坏）
        working-directory: app
        run: npm run build

      - name: 模块图可达性校验
        working-directory: app
        run: |
          # 不用 npx wait-on：它没在 package.json 里声明，npx 每次都要现场下载。
          # 纯 shell 轮询即可，省一个隐性网络依赖。
          npx vite preview --port 4188 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4188 -o /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:4188 -o /dev/null || { echo "❌ preview 未在 30s 内就绪"; exit 1; }
          node scripts/verify-module-graph.mjs http://localhost:4188

      - name: 确认 SPA 深链接回退已生成
        run: |
          test -f app/dist/404.html || { echo "❌ 缺少 dist/404.html，站内深链接会全部 404"; exit 1; }
          echo "✅ dist/404.html 存在"
