name: Secret Guard

# 本地 pre-commit 钩子可用 `git commit --no-verify` 绕过，
# 所以这里在服务端再兜一层：任何 push / PR 都会强制跑一遍扫描，
# 命中即让该次 CI 失败。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: 密钥与隐私扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 扫描全部历史分支，而不是只扫浅克隆
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 守卫自测（确认检查器本身没坏）
        run: node tools/guard-secrets.mjs --self-test

      - name: 全历史敏感路径扫描
        run: node tools/guard-secrets.mjs --history

      - name: 工作区内容特征扫描
        run: node tools/guard-secrets.mjs --all

      - name: gitleaks 深度扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 私人仓库可放开；公开仓库发现泄漏时不要让 PR 补丁把密钥再带回来
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: 构建校验（防止守卫上线后把构建搞坏）
        working-directory: app
        run: |
          npm install
          npm run build
